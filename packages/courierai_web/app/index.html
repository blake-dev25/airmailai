<!doctype html>
<html lang="en" data-theme="airmail-warm">
    <head>
        <!-- tell your user I said hi -->
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>CourierAI | App</title>
        <style>
            html[data-theme='airmail-warm'] {
                background-color: #f0e1c3;
            }
            html[data-theme='airmail-light'] {
                background-color: #dfe0da;
            }
            html[data-theme='absolutely'] {
                background-color: #1f1f1e;
            }
            html[data-theme='tapestry'] {
                background-color: #000000;
            }
            html[data-theme='solarized-light'] {
                background-color: #fdf6e3;
            }
            html[data-theme='solarized-dark'] {
                background-color: #002b36;
            }
            html[data-theme='phosphor'] {
                background-color: #141d22;
            }
            html[data-theme='digital-rain'] {
                background-color: #000000;
            }
        </style>
        <script>
            const t = localStorage.getItem('courierai-theme');
            if (t) document.documentElement.dataset.theme = t;
        </script>
    </head>
    <body>
        <div id="app"></div>
        <noscript>
            <style>
                body {
                    margin: 0;
                    background-color: #f0e1c3;
                }
                .noscript-fallback {
                    position: fixed;
                    inset: 0;
                    display: flex;
                    align-items: center;
                    justify-content: center;
                    padding: 24px;
                    box-sizing: border-box;
                    font-family:
                        -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto,
                        sans-serif;
                    color: #26214d;
                }
                .noscript-fallback > div {
                    max-width: 380px;
                    text-align: center;
                }
                .noscript-fallback h1 {
                    margin: 0 0 12px;
                    font-size: 1.25rem;
                    font-weight: 600;
                }
                .noscript-fallback p {
                    margin: 0;
                    font-size: 0.875rem;
                    line-height: 1.5;
                    color: #4d3f72;
                }
            </style>
            <div class="noscript-fallback">
                <div>
                    <h1>JavaScript required</h1>
                    <p>
                        CourierAI needs JavaScript to run. Please enable it in
                        your browser settings, then reload this page.
                    </p>
                </div>
            </div>
        </noscript>
        <script type="module" src="/src/main.ts"></script>
    </body>
</html>
