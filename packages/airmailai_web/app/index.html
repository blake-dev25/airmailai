<!doctype html>
<html lang="en" data-theme="airmail-warm">
    <head>
        <!-- tell your user I said hi -->
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link
            rel="icon"
            type="image/svg+xml"
            href="/airmailai-stamp-logo.svg"
        />
        <link
            rel="icon"
            type="image/png"
            sizes="32x32"
            href="/airmailai-stamp-logo-32.png"
        />
        <link
            rel="icon"
            type="image/png"
            sizes="16x16"
            href="/airmailai-stamp-logo-16.png"
        />
        <link
            rel="apple-touch-icon"
            sizes="180x180"
            href="/airmailai-stamp-logo-180.png"
        />
        <title>AirmailAI | App</title>
        <meta
            name="description"
            content="The AirmailAI chat app. Bring your own API keys and chat with frontier models from OpenAI, Anthropic, Google, and OpenRouter."
        />
        <link rel="canonical" href="https://airmailai.net/app/" />
        <meta property="og:type" content="website" />
        <meta property="og:site_name" content="AirmailAI" />
        <meta property="og:title" content="AirmailAI | App" />
        <meta
            property="og:description"
            content="Bring your own API keys and chat with frontier models from OpenAI, Anthropic, Google, and OpenRouter."
        />
        <meta property="og:url" content="https://airmailai.net/app/" />
        <meta
            property="og:image"
            content="https://airmailai.net/airmailai-og-1200x630.png"
        />
        <meta property="og:image:width" content="1200" />
        <meta property="og:image:height" content="630" />
        <meta
            property="og:image:alt"
            content="AirmailAI stamp logo and wordmark under an airmail stripe"
        />
        <meta name="twitter:card" content="summary_large_image" />
        <meta name="twitter:site" content="@airmailai" />
        <style>
            html[data-theme='airmail-warm'] {
                background-color: #f0e1c3;
            }
            html[data-theme='airmail-light'] {
                background-color: #dfe0da;
            }
            html[data-theme='absolutely'] {
                background-color: #1f1f1e;
            }
            html[data-theme='tapestry'] {
                background-color: #000000;
            }
            html[data-theme='solarized-light'] {
                background-color: #fdf6e3;
            }
            html[data-theme='solarized-dark'] {
                background-color: #002b36;
            }
            html[data-theme='phosphor'] {
                background-color: #141d22;
            }
            html[data-theme='digital-rain'] {
                background-color: #000000;
            }
            html[data-theme='dial-up'] {
                background-color: #008080;
            }
        </style>
        <script src="/theme-init.js"></script>
    </head>
    <body>
        <div id="app"></div>
        <noscript>
            <style>
                body {
                    margin: 0;
                    background-color: #f0e1c3;
                }
                .noscript-fallback {
                    position: fixed;
                    inset: 0;
                    display: flex;
                    align-items: center;
                    justify-content: center;
                    padding: 24px;
                    box-sizing: border-box;
                    font-family:
                        -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto,
                        sans-serif;
                    color: #26214d;
                }
                .noscript-fallback > div {
                    max-width: 380px;
                    text-align: center;
                }
                .noscript-fallback h1 {
                    margin: 0 0 12px;
                    font-size: 1.25rem;
                    font-weight: 600;
                }
                .noscript-fallback p {
                    margin: 0;
                    font-size: 0.875rem;
                    line-height: 1.5;
                    color: #4d3f72;
                }
            </style>
            <div class="noscript-fallback">
                <div>
                    <h1>JavaScript required</h1>
                    <p>
                        AirmailAI needs JavaScript to run. Please enable it in
                        your browser settings, then reload this page.
                    </p>
                </div>
            </div>
        </noscript>
        <script type="module" src="/src/main.ts"></script>
    </body>
</html>
