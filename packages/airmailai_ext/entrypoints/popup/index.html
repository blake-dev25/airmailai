<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>AirmailAI Extension</title>
        <style>
            *,
            *::before,
            *::after {
                box-sizing: border-box;
                margin: 0;
                padding: 0;
            }

            body {
                width: 220px;
                background: #f0e1c3;
                color: #26214d;
                font-family: system-ui, sans-serif;
                font-size: 13px;
            }

            .header {
                display: flex;
                align-items: center;
                gap: 8px;
                padding: 14px 14px 12px;
                border-bottom: 1px solid #d4bc87;
            }

            .logo {
                font-family: Courier, monospace;
                font-size: 18px;
                font-weight: 600;
                letter-spacing: -0.02em;
            }

            .actions {
                display: flex;
                flex-direction: column;
                gap: 6px;
                padding: 12px;
            }

            .btn {
                width: 100%;
                padding: 8px 12px;
                border: 1px solid #d4bc87;
                border-radius: 7px;
                background: #f0e1c3;
                color: #26214d;
                font-family: system-ui, sans-serif;
                font-size: 12px;
                font-weight: 500;
                cursor: pointer;
                text-align: left;
                transition:
                    background 0.1s,
                    border-color 0.1s;
            }

            .btn:hover {
                background: #e5d2a8;
            }

            .btn-danger {
                color: #c14227;
                border-color: #c14227;
            }

            .btn-danger:hover {
                background: #f7e8e3;
            }

            .btn:disabled {
                opacity: 0.5;
                cursor: not-allowed;
            }

            .status {
                padding: 0 12px 12px;
                font-size: 11px;
                color: #4d3f72;
                min-height: 16px;
            }

            .status.error {
                color: #c14227;
            }
        </style>
    </head>
    <body>
        <div class="header">
            <svg
                width="18"
                height="18"
                viewBox="0 0 18 18"
                fill="none"
                aria-hidden="true"
            >
                <rect
                    x="1"
                    y="3"
                    width="16"
                    height="12"
                    rx="2"
                    stroke="#26214d"
                    stroke-width="1.5"
                />
                <path
                    d="M1 6l8 5 8-5"
                    stroke="#26214d"
                    stroke-width="1.5"
                    stroke-linejoin="round"
                />
            </svg>
            <span class="logo">AirmailAI</span>
        </div>
        <div class="actions">
            <button class="btn" id="btn-export-openrouter" type="button">
                Export OpenRouter model list
            </button>
            <button class="btn btn-danger" id="btn-clear-chats" type="button">
                Delete chat history
            </button>
            <button class="btn btn-danger" id="btn-clear-all" type="button">
                Delete all local storage
            </button>
        </div>
        <div class="status" id="status"></div>
        <script type="module" src="./main.ts"></script>
    </body>
</html>
